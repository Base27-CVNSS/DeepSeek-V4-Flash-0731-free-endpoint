name = "base27-free-llm-router"
main = "src/index.js"
compatibility_date = "2026-08-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/v1/*", "/api/*", "/health"]

[vars]
APP_NAME = "Base27 Free LLM Router"
APP_URL = "https://example.com"
ALLOWED_ORIGINS = "*"
PUBLIC_RPM = "30"
PUBLIC_BURST = "20"
MAX_PROVIDER_ATTEMPTS = "5"
UPSTREAM_TIMEOUT_MS = "60000"
